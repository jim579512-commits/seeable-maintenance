<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}看得見的保養｜{{ role }}{% endblock %}</title>
<link rel="stylesheet" href="/static/css/app.css?v={{ asset_v }}">
</head>
<body class="erp">
<div class="e-shell">
  <aside class="e-side" aria-label="系統選單">
    <div class="e-brand"><span class="brand-mark">TOYOTA</span><span class="app">看得見的保養</span><small>技師端（概念原型）</small></div>
    <nav class="e-nav">
      <div class="grp">技師端</div>
      <a href="/sa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5h6v2.5H9zM8.5 11h7M8.5 14.5h7M8.5 18h4"/></svg>技師端首頁</a>
      <a href="/tech"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6.5a3.5 3.5 0 0 0 4.6 4.6l-7.6 7.6a2.1 2.1 0 0 1-3-3l7.6-7.6a3.5 3.5 0 0 0-1.6-1.6Z"/><path d="m15.5 5 2-2 3.5 3.5-2 2"/></svg>技師回報<b class="cnt alert" data-cnt="photos"></b></a>
      <a href="/sa/addons"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4.5 6v5.5c0 4.4 3.2 8 7.5 9.5 4.3-1.5 7.5-5.1 7.5-9.5V6L12 3Z"/><path d="m8.8 12.2 2.3 2.3 4.3-4.6"/></svg>追加審核<b class="cnt alert" data-cnt="review"></b></a>
      <a href="/sa/questions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a7.5 7.5 0 0 1-10.9 6.7L4 20l1.4-4.6A7.5 7.5 0 1 1 20 12Z"/><path d="M9 11.5h.01M12.5 11.5h.01M16 11.5h.01"/></svg>車主提問<b class="cnt alert" data-cnt="questions"></b></a>
      <a href="/sa/lounge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5V9Z"/><path d="M16 10.5h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8.5 3.5v2M12 3.5v2"/></svg>客休服務需求<b class="cnt alert" data-cnt="lounge"></b></a>
      <a href="/dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>車主之聲</a>
      <a href="/dashboard/techs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="5"/><path d="m9 13.5-1.5 7 4.5-2.5 4.5 2.5-1.5-7"/></svg>技師績效</a>
      <a href="/lounge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16.5V20"/></svg>進度回報（客休室螢幕）</a>

      <a href="/logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4.5h4.5v15H14"/><path d="M10 8.5 6.5 12 10 15.5M6.5 12H16"/></svg>登出</a>
    </nav>
    <div class="e-side-foot">概念原型・車主與車輛資料皆為虛構・價格僅供示意</div>
  </aside>
  <div class="e-scrim" data-side-close></div>

  <div class="e-main">
    <header class="e-top">
      <button class="burger" type="button" data-side-toggle aria-label="開啟選單"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <nav class="e-crumb" aria-label="目前位置">{% block crumbs %}<b>{{ role }}</b>{% endblock %}</nav>
      <div class="e-top-right">
        <span class="e-clock" data-clock></span>
        <span class="ai-pill" data-ai-pill>AI：讀取中…</span>
        <span class="e-user"><i aria-hidden="true">專</i><span>專員／技師</span></span><a class="small" href="/logout">登出</a>
      </div>
    </header>
    <main class="e-content">{% block content %}{% endblock %}</main>
    <div class="e-foot-note">2026 和泰 AI 黑客松・概念原型</div>
  </div>
</div>
<script src="/static/js/common.js?v={{ asset_v }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
