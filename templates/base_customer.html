<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>{% block title %}看得見的保養{% endblock %}</title>
<link rel="stylesheet" href="/static/css/app.css?v={{ asset_v }}">
</head>
<body class="cust">
<div class="phone">
  <header class="c-head">
    <div class="c-brand"><span class="brand-mark">TOYOTA</span><span class="brand-sub">看得見的保養</span></div>
    <button class="font-toggle" type="button" data-font-toggle aria-label="切換字體大小" title="放大／縮小字體">A+</button>
  </header>
  <main class="c-main">{% block content %}{% endblock %}</main>
  <footer class="c-foot">概念原型・車主與車輛資料皆為虛構・價格僅供示意</footer>
  {% block tabs %}
  {% if v %}
  <nav class="c-tabs" aria-label="頁面切換">
    <a href="/c/{{ v.id }}" class="{{ 'on' if tab == 'home' }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M9 8h6M9 12h6M9 16h3.5"/></svg>
      今日說明</a>
    <a href="/c/{{ v.id }}/chat" class="{{ 'on' if tab == 'chat' }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a7.5 7.5 0 0 1-10.9 6.7L4 20l1.4-4.6A7.5 7.5 0 1 1 20 12Z"/><path d="M9 11.5h.01M12.5 11.5h.01M16 11.5h.01"/></svg>
      問答</a>
    <a href="/c/{{ v.id }}/prices" class="{{ 'on' if tab == 'prices' }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h12v17l-2-1.3-2 1.3-2-1.3-2 1.3-2-1.3-2 1.3z"/><path d="M9 8h6M9 11.5h6M9 15h4"/></svg>
      價目表</a>
    <a href="/c/{{ v.id }}/report" class="{{ 'on' if tab == 'report' }} {{ '' if v.stage >= 5 else 'off' }}" data-report-tab>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/><path d="M8.5 11.5h2l1-2 2 4 1-2h1.5"/></svg>
      健康報告</a>
  </nav>
  {% endif %}
  {% endblock %}
</div>
<script src="/static/js/common.js?v={{ asset_v }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
