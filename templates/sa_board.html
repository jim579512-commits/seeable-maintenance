{% extends "base_staff.html" %}
{% block crumbs %}<span>技師端</span><span class="sep">›</span><b>技師端首頁</b>{% endblock %}
{% block content %}
<div class="e-cp">
  <div><div class="e-title">技師端</div><div class="e-sub"><span id="now"></span></div></div>
  <div class="e-actions">
    <a class="btn btn-outline" href="/tech">技師回報</a>
    <a class="btn btn-outline" href="/sa/questions">車主提問</a>
  </div>
</div>

<div class="e-kpis" id="kpis"></div>

<div class="e-panel">
  <div class="e-tabs" id="boardTabs">
    <button type="button" data-tab="orders" class="on">在廠車輛 <span class="b" id="bOrders"></span></button>
    <button type="button" data-tab="appts">預約未到 <span class="b" id="bAppts"></span></button>
  </div>
  <div class="e-pane on" data-pane="orders">
    <div class="e-scroll"><table class="e-table">
      <thead><tr><th>工單</th><th>車輛</th><th>車主</th><th>技師</th><th>目前階段</th><th>預估完工</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <div class="e-foot"><span id="ordersFoot"></span><span>點整列開啟工單</span></div>
  </div>
  <div class="e-pane" data-pane="appts">
    <div class="e-scroll"><table class="e-table">
      <thead><tr><th>預約時間</th><th>車輛</th><th>車主</th><th>服務</th><th>指名技師</th><th></th></tr></thead>
      <tbody id="appts"></tbody>
    </table></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
  const E = App.esc, $ = (id) => document.getElementById(id);
  const showTab = App.tabs('#boardTabs');

  function kpi(label, value, sub, opt) {
    opt = opt || {};
    const cls = 'e-kpi' + (opt.warn ? ' warn' : '');
    const body = '<div class="l">' + E(label) + '</div><div class="v">' + E(value) + '</div><div class="s">' + E(sub || '') + '</div>';
    if (opt.href) return '<a class="' + cls + '" href="' + opt.href + '">' + body + '</a>';
    return '<button type="button" class="' + cls + '" data-go="' + opt.tab + '">' + body + '</button>';
  }
  function row(r) {
    const done = r.eta.state === 'done';
    const href = '/sa/visit/' + E(r.id);
    return '<tr data-href="' + href + '">' +
      '<td><a href="' + href + '"><b>' + E(r.id) + '</b></a></td>' +
      '<td class="nowrap"><span class="plate">' + E(r.plate) + '</span><div class="sub">' + E(r.model) + '</div></td>' +
      '<td class="nowrap">' + E(r.owner) + '</td>' +
      '<td class="nowrap">' + E(r.technician || '—') + (r.requested && r.requested === r.technician ? '<span class="e-tag">指名</span>' : '') + '</td>' +
      '<td class="nowrap"><span class="st ' + (done ? 'green' : 'blue') + '">' + E(r.stage_name) + '</span></td>' +
      '<td class="nowrap num">' + E(done ? '已完工' : r.eta.hm) + '</td>' +
      '<td class="nowrap"><a class="btn btn-outline btn-sm" href="' + href + '">工單 ›</a></td></tr>';
  }
  function render(d, n) {
    $('now').textContent = '現在 ' + d.now;
    $('kpis').innerHTML =
      kpi('在廠車輛', n.cars, '點這裡看清單', { tab: 'orders' }) +
      kpi('預約未到', n.appointments, '報到後開始計時', { tab: 'appts' }) +
      kpi('追加待審核', n.review, '核可後才會送到車主手機', { warn: n.review > 0, href: '/sa/addons' }) +
      kpi('提問待回覆', n.questions, 'AI 轉給專員的問題', { warn: n.questions > 0, href: '/sa/questions' }) +
      kpi('車主照片待技師看', n.photos, '技師回報頁', { warn: n.photos > 0, href: '/tech' });
    $('bOrders').textContent = d.rows.length || '';
    $('bAppts').textContent = d.appointments.length || '';
    $('rows').innerHTML = d.rows.length ? d.rows.map(row).join('') : '<tr><td colspan="7" class="e-empty">目前沒有在廠車輛</td></tr>';
    $('ordersFoot').textContent = '共 ' + d.rows.length + ' 台・進行中 ' + d.stats.working + '・已完工 ' + d.stats.done;
    $('appts').innerHTML = d.appointments.length ? d.appointments.map(a =>
      '<tr><td class="nowrap"><b class="num">' + E(a.day) + '</b>' + (a.online ? '<div><span class="st blue" style="margin-top:3px">線上預約</span></div>' : '') + '</td>' +
      '<td class="nowrap"><span class="plate">' + E(a.plate) + '</span> ' + E(a.model) + '</td>' +
      '<td class="nowrap">' + E(a.owner) + '</td><td class="nowrap">' + E(a.service) + '</td>' +
      '<td>' + (a.requested ? E(a.requested) + '<span class="e-tag">指名</span>' : '<span class="dim">未指定</span>') + '</td>' +
      '<td class="nowrap"><button class="btn btn-dark btn-sm" type="button" data-checkin="' + E(a.id) + '">報到</button> ' +
      '<a class="btn btn-ghost btn-sm" href="/c/' + E(a.id) + '">車主頁 ›</a></td></tr>'
    ).join('') : '<tr><td colspan="6" class="e-empty">今天的預約都已報到</td></tr>';
  }
  async function load() {
    const [d, n] = await Promise.all([App.api('/api/board'), App.api('/api/nav')]);
    render(d, n);
  }

  document.addEventListener('click', async (e) => {
    const go = e.target.closest('[data-go]');
    if (go) { showTab(go.dataset.go); return; }
    const c = e.target.closest('[data-checkin]');
    if (!c) return;
    try { const r = await App.post('/api/visit/' + c.dataset.checkin + '/checkin'); location.href = r.href; }
    catch (err) { App.toast(err.message); }
  });
  App.poll(load, 3000);
})();
</script>
{% endblock %}
