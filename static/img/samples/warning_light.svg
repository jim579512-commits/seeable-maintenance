<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui, 'Microsoft JhengHei', 'PingFang TC', sans-serif">
  <rect width="640" height="400" fill="#FFFFFF"/>
  <text x="32" y="46" font-size="22" font-weight="700" fill="#16181D">儀表板亮了黃色警示燈</text>
  <text x="32" y="72" font-size="14" fill="#6A707A">示意圖｜實際使用時是車主用手機拍下的儀表板</text>
  <!-- 儀表板 -->
  <rect x="40" y="96" width="560" height="272" rx="26" fill="#1B1E24"/>
  <rect x="52" y="108" width="536" height="248" rx="20" fill="#0F1115"/>
  <!-- 速度表 -->
  <circle cx="200" cy="236" r="96" fill="none" stroke="#2C313A" stroke-width="12"/>
  <path d="M 132 304 A 96 96 0 1 1 268 304" fill="none" stroke="#3A7BD5" stroke-width="6" stroke-linecap="round"/>
  <line x1="200" y1="236" x2="146" y2="198" stroke="#EB0A1E" stroke-width="4" stroke-linecap="round"/>
  <circle cx="200" cy="236" r="9" fill="#EAECEF"/>
  <text x="200" y="286" font-size="30" font-weight="700" fill="#EAECEF" text-anchor="middle">0</text>
  <text x="200" y="306" font-size="12" fill="#8A9099" text-anchor="middle">km/h</text>
  <!-- 右側資訊 -->
  <text x="330" y="160" font-size="14" fill="#8A9099">ODO</text>
  <text x="330" y="186" font-size="22" font-weight="700" fill="#EAECEF">30,120 km</text>
  <text x="330" y="224" font-size="14" fill="#8A9099">外氣溫度 24°C</text>
  <!-- 亮起的黃色警示燈（胎壓警示樣式） -->
  <g transform="translate(470 250)">
    <circle r="46" fill="#F79009" opacity="0.18"/>
    <path d="M -24 -22 C -30 -6 -30 10 -22 24 L 22 24 C 30 10 30 -6 24 -22" fill="none" stroke="#FDB022" stroke-width="5" stroke-linecap="round"/>
    <path d="M -22 30 L -16 24 M -8 30 L -2 24 M 6 30 L 12 24 M 18 30 L 22 26" stroke="#FDB022" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="-12" x2="0" y2="6" stroke="#FDB022" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="15" r="3" fill="#FDB022"/>
  </g>
  <!-- 其他未亮的燈 -->
  <circle cx="330" cy="318" r="9" fill="#2C313A"/><circle cx="360" cy="318" r="9" fill="#2C313A"/><circle cx="390" cy="318" r="9" fill="#2C313A"/>
  <!-- 車主的疑問 -->
  <rect x="404" y="116" width="170" height="52" rx="12" fill="#FFF4E5" stroke="#FEC84B"/>
  <text x="418" y="140" font-size="14" font-weight="700" fill="#93370D">這個燈是什麼意思？</text>
  <text x="418" y="159" font-size="12" fill="#93370D">可以繼續開嗎？</text>
</svg>
