<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui, 'Microsoft JhengHei', 'PingFang TC', sans-serif">
  <rect width="640" height="400" fill="#FFFFFF"/>
  <text x="32" y="46" font-size="22" font-weight="700" fill="#16181D">節氣門內部</text>
  <text x="32" y="72" font-size="14" fill="#6A707A">示意圖｜實際使用時是技師現場拍的照片或影片</text>
  <!-- 節氣門本體 -->
  <circle cx="250" cy="228" r="128" fill="#C9CED5"/>
  <circle cx="250" cy="228" r="104" fill="#F4F5F7"/>
  <!-- 積碳環 -->
  <circle cx="250" cy="228" r="98" fill="none" stroke="#3A3226" stroke-width="12" stroke-dasharray="40 14 26 18 50 12" opacity=".75"/>
  <!-- 蝶閥 -->
  <ellipse cx="250" cy="228" rx="94" ry="22" fill="#8F959E" transform="rotate(-18 250 228)"/>
  <line x1="150" y1="260" x2="350" y2="196" stroke="#5A6068" stroke-width="5"/>
  <!-- 說明 -->
  <line x1="340" y1="168" x2="420" y2="140" stroke="#16181D" stroke-width="1"/>
  <text x="426" y="144" font-size="14" fill="#16181D">邊緣的黑色油泥（積碳）</text>
  <line x1="330" y1="232" x2="420" y2="232" stroke="#16181D" stroke-width="1"/>
  <text x="426" y="236" font-size="14" fill="#16181D">蝶閥：控制進氣量</text>
  <rect x="420" y="276" width="190" height="72" rx="10" fill="#ECFDF3" stroke="#ABEFC6"/>
  <text x="434" y="302" font-size="13.5" font-weight="700" fill="#067647">輕微積碳</text>
  <text x="434" y="324" font-size="12.5" fill="#16181D">不影響安全</text>
  <text x="434" y="342" font-size="12.5" fill="#16181D">沒有症狀可下次再評估</text>
</svg>
