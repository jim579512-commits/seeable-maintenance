<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui, 'Microsoft JhengHei', 'PingFang TC', sans-serif">
  <rect width="640" height="400" fill="#FFFFFF"/>
  <text x="32" y="46" font-size="22" font-weight="700" fill="#16181D">輪胎胎紋深度</text>
  <text x="32" y="72" font-size="14" fill="#6A707A">示意圖｜實際使用時是技師現場拍的照片或影片</text>
  <!-- 新胎剖面 -->
  <text x="150" y="112" font-size="15" font-weight="700" fill="#16181D" text-anchor="middle">新胎</text>
  <rect x="60" y="200" width="180" height="60" fill="#2B2F36"/>
  <g fill="#2B2F36"><rect x="60" y="124" width="30" height="76"/><rect x="110" y="124" width="30" height="76"/><rect x="160" y="124" width="30" height="76"/><rect x="210" y="124" width="30" height="76"/></g>
  <line x1="252" y1="124" x2="252" y2="200" stroke="#16181D" stroke-width="1.5"/>
  <text x="258" y="166" font-size="13.5" fill="#16181D">約 8 mm</text>
  <!-- 磨耗胎剖面 -->
  <text x="450" y="112" font-size="15" font-weight="700" fill="#93370D" text-anchor="middle">磨耗後</text>
  <rect x="360" y="200" width="180" height="60" fill="#2B2F36"/>
  <g fill="#2B2F36"><rect x="360" y="178" width="30" height="22"/><rect x="410" y="178" width="30" height="22"/><rect x="460" y="178" width="30" height="22"/><rect x="510" y="178" width="30" height="22"/></g>
  <line x1="552" y1="178" x2="552" y2="200" stroke="#93370D" stroke-width="1.5"/>
  <text x="558" y="194" font-size="13.5" fill="#93370D">約 2 mm</text>
  <!-- 門檻 -->
  <rect x="60" y="292" width="520" height="84" rx="10" fill="#F4F5F7"/>
  <circle cx="84" cy="318" r="6" fill="#067647"/><text x="98" y="323" font-size="14" fill="#16181D">3 mm 以上：正常</text>
  <circle cx="264" cy="318" r="6" fill="#DC6803"/><text x="278" y="323" font-size="14" fill="#16181D">3 mm 以下：建議近期更換</text>
  <circle cx="84" cy="352" r="6" fill="#B42318"/><text x="98" y="357" font-size="14" fill="#16181D">1.6 mm 以下：不符合法規，濕地容易打滑</text>
</svg>
